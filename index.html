<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>KLyrics</title>
    <!-- Lock down the layout bounds strictly -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1c1b1f">
    <style>
        html {
            background-color: #1c1b1f;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        body {
            background-color: #1c1b1f;
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            -webkit-text-size-adjust: 100%;
        }


        #app-root {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            width: 100%;

            height: 100vh;

            margin: 0;
            padding: 0;
            box-sizing: border-box;

            background-color: #1c1b1f;

            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
    </style>
</head>
<body>
<div id="app-root"></div>
<script src="webApp.js"></script>
</body>
</html>
